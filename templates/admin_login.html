{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-lg border-warning border-2">
            <h3 class="fw-bold text-center mb-3 text-dark">System Admin Login</h3>
            <p class="text-center text-muted small mb-4">Restricted access for AMA Lipa administrators and developers.</p>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Admin Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark">Unlock Panel</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
