<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMA Lipa - Bag Owner Detection System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 40%, #780000 80%, #c1121f 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #212529 !important;
        }
        .navbar {
            background: #0d1b2a !important;
            border-bottom: 3px solid #ffb703;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            background: #ffffff !important;
        }
        h1, h2, h3, h4, h5, h6, label {
            color: #0d1b2a !important;
            font-weight: 700;
        }
        .btn-primary {
            background: #780000 !important;
            border: none;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #a50104 !important;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-5 py-3">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="{{ url_for('index') }}">BagGuard ID System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="navbar-nav gap-3">
                    <a class="nav-link text-white fw-semibold" href="{{ url_for('index') }}">Home</a>
                    <a class="nav-link text-white fw-semibold" href="{{ url_for('register') }}">Register Bag</a>
                    <a class="nav-link text-white fw-semibold" href="{{ url_for('scan') }}">Scan / Detect Bag</a>
                    <a class="nav-link text-white fw-semibold" href="{{ url_for('transactions') }}">Cloud Transactions</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container pb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
