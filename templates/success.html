{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center text-center">
    <div class="col-md-6 card shadow p-4">
        <h3 class="text-success mb-3">Registration Successful!</h3>
        <p>Your unique bag tag code is:</p>
        <h4 class="text-primary font-monospace">{{ bag.unique_code }}</h4>
        
        <div class="my-3">
            <img src="{{ url_for('static', filename=bag.qr_code_path) }}" alt="QR Code" class="img-fluid border p-2 bg-white" style="max-width: 200px;">
        </div>
        
        <p class="text-muted">Save or print this code/QR tag. Entering this ID in the scan page will pull up your contact details.</p>
        
        <div class="d-grid gap-2">
            <a href="{{ url_for('register') }}" class="btn btn-primary">Register Another Bag</a>
            <a href="{{ url_for('scan') }}" class="btn btn-outline-success">Go to Lookup Page</a>
        </div>
    </div>
</div>
{% endblock %}
