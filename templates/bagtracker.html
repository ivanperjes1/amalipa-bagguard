{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-12 text-center mb-4">
            <h2 class="text-white font-weight-bold">BagTracker Interface</h2>
            <p class="text-muted">Scan or search student IDs to monitor bag entry and exit records.</p>
        </div>
    </div>
    
    <div class="card bg-dark text-white p-4 shadow-lg border-secondary">
        <div class="form-group mb-3">
            <label for="bagSearchInput">Search Student ID / Barcode:</label>
            <input type="text" id="bagSearchInput" class="form-control bg-secondary text-white border-0" placeholder="Scan barcode or enter ID number...">
        </div>
        <button class="btn btn-danger btn-block font-weight-bold">Process Entry / Exit</button>
    </div>
</div>
{% endblock %}
